<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>WebStore</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="site-frame">

        <!-- Navigation is inserted here -->
        <div id="site-nav"></div>


        <main class="page-content">

            <aside class="sidebar">

                <input
                    class="sidebar-search"
                    type="search"
                    placeholder="Search">

                <div class="sidebar-section">

                    <div class="sidebar-title">
                        Categories
                    </div>

                    <ul>

                        <li>
                            <a href="#">Sale</a>
                        </li>

                        <li>
                            <a href="#">New arrivals</a>
                        </li>

                        <li>
                            <a href="#">Products</a>
                        </li>

                        <li>
                            <a href="#">Classic</a>
                        </li>

                        <li>
                            <a href="#">Casual</a>
                        </li>

                    </ul>

                </div>

            </aside>


            <section class="main-content">

                <div class="hero">

                    <h1>
                        New Collection
                    </h1>

                    <p>
                        Discover our latest collection
                        of carefully selected products.
                    </p>

                </div>


                <div class="card-grid">

                    <div class="card large">

                        <div class="card-info">

                            <div class="card-title">
                                Limited Edition
                            </div>

                            <div class="card-price">
                                $199.99
                            </div>

                        </div>

                    </div>


                    <div class="card">

                        <div class="card-info">

                            <div class="card-title">
                                Premium Package
                            </div>

                            <div class="card-price">
                                $49.99
                            </div>

                        </div>

                    </div>


                    <div class="card">

                        <div class="card-info">

                            <div class="card-title">
                                Business Package
                            </div>

                            <div class="card-price">
                                $29.99
                            </div>

                        </div>

                    </div>


                    <div class="card">

                        <div class="card-info">

                            <div class="card-title">
                                Standard Package
                            </div>

                            <div class="card-price">
                                $9.99
                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </main>


        <footer class="footer">

            <span>
                © 2026 WebStore
            </span>

            <div class="footer-links">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">Contact</a>
            </div>

        </footer>

    </div>


    <script src="navigation.js"></script>

</body>

</html>
